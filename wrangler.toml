# Rizzova Edge – API + ingestion engine (one Worker).
# The storefront (React Router v7) is a separate project that binds the SAME D1/KV ids; see ARCHITECTURE.md.
# Replace every REPLACE_ME id with the output of the create commands in README.md.

name = "rizzova-edge"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[vars]
AE_GATEWAY = "https://api-sg.aliexpress.com"
AE_SHIP_TO_COUNTRY = "AU"
STORE_CURRENCY = "AUD"
STORE_LANGUAGE = "en"
CJ_USD_AUD = "1.55"            # CJdropshipping prices are USD
CJ_PRICE_MARKUP = "1.6"        # CJ AU-warehouse retail = cost x this
PRICE_MARKUP = "2.2"            # retail = AliExpress cost x markup, rounded to .99
COMPARE_AT_MARKUP = "1.3"       # compare-at = retail x this (0 disables)
PUBLIC_SITE_URL = "https://rizzova.com"
CF_IMAGES_ACCOUNT_HASH = ""   # empty = no Cloudflare Images; product photos are served from the supplier CDN
CHECKOUT_COUNTRIES = "AU,US,AE"
AUTO_FULFIL = "off"            # "on" = paid live orders are placed on AliExpress automatically
# Nightly discovery (src/ingest/discover.ts): promo feeds -> vetting -> import.
DISCOVERY_FEEDS = "DS_Winter-must-haves,AEB_Topseller_PriceRange0_20,DS_ConsumerElectronics_bestsellers,DS_NewYear'sEveEssentials,DS_BoxingDayEssentials,DS_Home&Kitchen_bestsellers,AEB_AU_HomeImprovement&Furniture&Lights&Tools&Luggage,AEB_SHOPLAZZA_Toys&Hobbies_$10~20_20241118,AEB_SHOPLAZZA_Mother&Kids_$10~30_20241115,pets&supplies_ZA topsellers_ 20240423,DS_NewArrivals,AEB_Topseller_PriceRange0~20$,toys_ZA topsellers_ 20240423,AEB_SHOPLAZZA_Toys&Hobbies_$0~10_20241115,AEB_SHOPLAZZA_Mother&Kids_$0~10_20241115,DS_Sports&Outdoors_bestsellers"
DISCOVERY_PER_FEED = "100"
# AliExpress calls per UTC day after which optional work (vetting, discovery, search) stops; orders and stock sync always run.
AE_OPTIONAL_DAILY_BUDGET = "2500"
# Best-seller keyword searches every night (top 100 by orders each), plus any typed on /console/suggestions.
# Paused 22 Nov 2026 while AliExpress refuses searches (NGSELECTION_SEARCH_ERROR); rename back to DISCOVERY_KEYWORDS to resume.
DISCOVERY_KEYWORDS_PAUSED = "christmas gift,stocking stuffer,pet bed,dog toy,cat toy,kids puzzle,plush toy,fidget toy,kitchen gadget,home organizer,desk organizer,night light,wall decor,travel organizer,car organizer,baby play mat,water bottle,lunch box,candle,gift box"
DISCOVERY_MIN_RATING = "4.5"     # product rating floor; 4.5 allowed when demand is high (owner, Nov 2026)
DISCOVERY_MIN_STORE_RATING = "4.6" # each of the store's three ratings
DISCOVERY_MIN_ORDERS = "100"
DISCOVERY_MAX_SHIP_CENTS = "500" # supplier delivery per country, store currency (owner rule since 20 Nov 2026: up to A$5)
DISCOVERY_COUNTRIES = "AU,US,AE"   # AU must be reachable within the cost limit; US/AE optional per product
DISCOVERY_DAILY_LIMIT = "10"     # most products auto-imported per 24 hours
DISCOVERY_MAX_PRICE_CENTS = "8000" # store price cap A$80 (owner: careful, not over-protective)
AUTO_IMPORT = "off"              # owner approves suggestions at /console/suggestions; "on" imports up to the daily limit

# Secrets (set with `wrangler secret put NAME`, never in this file):
#   AE_APP_KEY, AE_APP_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
#   CF_ACCOUNT_ID, CF_IMAGES_API_TOKEN, ADMIN_TOKEN

# Owner alerts by email through Cloudflare Email Routing (free). The recipient is the ALERT_TO secret,
# which must be a verified destination address in rizzova.com's Email Routing.
[[send_email]]
name = "ALERT_EMAIL"

[[d1_databases]]
binding = "DB"
database_name = "rizzova-db"
database_id = "002681e9-a691-402a-a80b-e34674cd5e43"

[[kv_namespaces]]
binding = "KV"
id = "ccea270547594c529e417239a5b8e0aa"

[[queues.producers]]
binding = "JOBS"
queue = "rizzova-jobs"

[[queues.consumers]]
queue = "rizzova-jobs"
max_batch_size = 3               # each job may make up to 9 AliExpress calls; free plan allows 50 per invocation
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "rizzova-jobs-dlq"

[triggers]
crons = [
  "*/15 * * * *",   # token health: refresh before expiry
  "0 */6 * * *",    # catalogue sync: re-pull the stalest products + drain import_queue
  "0 13 * * *"      # midnight Sydney: product discovery from promo feeds + poll tracking for open fulfilments
]

# ───────────── Staging environment (separate data) ─────────────
[env.staging]
name = "rizzova-edge-staging"
vars = { AE_GATEWAY = "https://api-sg.aliexpress.com", AE_SHIP_TO_COUNTRY = "AU", STORE_CURRENCY = "AUD", STORE_LANGUAGE = "en", PRICE_MARKUP = "2.2", COMPARE_AT_MARKUP = "1.3", PUBLIC_SITE_URL = "https://staging.rizzova.com", CF_IMAGES_ACCOUNT_HASH = "REPLACE_ME", CHECKOUT_COUNTRIES = "AU,NZ" }
d1_databases = [{ binding = "DB", database_name = "rizzova-db-staging", database_id = "REPLACE_ME" }]
kv_namespaces = [{ binding = "KV", id = "REPLACE_ME" }]
queues = { producers = [{ binding = "JOBS", queue = "rizzova-jobs-staging" }], consumers = [{ queue = "rizzova-jobs-staging", max_batch_size = 10, max_retries = 5, dead_letter_queue = "rizzova-jobs-staging-dlq" }] }
triggers = { crons = ["*/15 * * * *", "0 */6 * * *", "0 13 * * *"] }
